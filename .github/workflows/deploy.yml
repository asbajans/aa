name: Deploy to Portainer

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
        env:
          # Build sırasında env gerekirse dummy değerler (Gerçek değerler Portainer'da)
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_SECRET: dummy_secret_32_chars_min_for_build_test

  deploy:
    name: Trigger Portainer webhook
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Call Portainer webhook
        run: |
          if [ -z "${{ secrets.PORTAINER_WEBHOOK_URL }}" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL secret tanımlı değil. Repo Settings > Secrets and variables > Actions > New repository secret ile ekleyin."
            exit 1
          fi
          echo "Portainer webhook tetikleniyor..."
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/resp.txt
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Portainer deploy tetiklendi. Portainer Logs > Stack deploy loglarını takip edin."
          else
            echo "::error::Webhook $HTTP_CODE ile başarısız oldu"
            exit 1
          fi
