services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akademi-web
    ports:
      - "4000:3000" # HOST:4000 -> CONTAINER:3000 | Cloudflare Tunnel: akademi.biz.tr -> http://web:3000
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-akademi}:${DB_PASSWORD:-change_me}@db:5432/${DB_NAME:-akademi}
      REDIS_URL: redis://redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://akademi.biz.tr}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://akademi.biz.tr}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      IYZICO_API_KEY: ${IYZICO_API_KEY}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY}
      PAYTR_MERCHANT_ID: ${PAYTR_MERCHANT_ID}
      PAYTR_MERCHANT_KEY: ${PAYTR_MERCHANT_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - akademi-network

  db:
    image: pgvector/pgvector:pg16
    container_name: akademi-db
    environment:
      POSTGRES_DB: ${DB_NAME:-akademi}
      POSTGRES_USER: ${DB_USER:-akademi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./drizzle/migrations:/docker-entrypoint-initdb.d
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/00-init.sql
    ports:
      - "4001:5432" # HOST:4001 -> CONTAINER:5432 (opsiyonel debug, tunnel gerekmez)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-akademi} -d ${DB_NAME:-akademi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - akademi-network

  redis:
    image: redis:7-alpine
    container_name: akademi-redis
    ports:
      - "4002:6379" # HOST:4002 -> CONTAINER:6379 (opsiyonel debug, tunnel gerekmez)
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - akademi-network

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: akademi-livekit
    command: --config /etc/livekit.yaml
    ports:
      - "4003:7880" # HOST:4003 -> CONTAINER:7880 (LiveKit API/WS) | Tunnel: livekit.akademi.biz.tr -> http://livekit:7880
      - "4004:7881" # HOST:4004 -> CONTAINER:7881 (RTC TCP)
      - "4005:7882/tcp" # HOST:4005 -> CONTAINER:7882 (TURN TCP)
      - "4006-4016:50000-50010/udp" # HOST:4006-4016 -> CONTAINER:50000-50010/udp (RTC UDP range, 11 port = max 10 katılımcı için yeterli)
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
    restart: unless-stopped
    networks:
      - akademi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflare Tunnel - host'ta ayrı çalışıyorsa bu servisi kapatın
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: akademi-tunnel
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  #   restart: unless-stopped
  #   networks: [akademi-network]

volumes:
  pgdata:
  redisdata:

networks:
  akademi-network:
    driver: bridge
